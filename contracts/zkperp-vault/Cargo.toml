[package]
name = "zkperp-vault"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
zkperp-poseidon = { path = "../../crates/zkperp-poseidon" }
groth16 = { path = "../../crates/groth16" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
serde_json = "1"
ed25519-dalek = "2.1.1"
